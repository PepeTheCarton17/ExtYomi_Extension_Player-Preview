name: ExtYomi Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.repository == 'PepeTheCarton17/ExtYomi_Extension_Player-Preview'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@94baf225fe0a508e581a564467443d0e2379123b # v4.3.0

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/extyomi-preview.p12"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/extyomi-preview.p12" >> "$GITHUB_ENV"

      - name: Build signed preview APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assemblePreview -Penable-updater --no-daemon --stacktrace

      - name: Generate checksums
        run: |
          cd app/build/outputs/apk/preview
          sha256sum *.apk > checksums.txt

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # app/build.gradle.kts is the single source of truth: the in-app version,
          # the tag and the release title cannot drift apart again.
          VERSION=$(awk -F'"' '/^[[:space:]]*versionName = / { print $2; exit }' app/build.gradle.kts)
          if [ -z "$VERSION" ]; then
            echo "Could not read versionName from app/build.gradle.kts" >&2
            exit 1
          fi
          TAG="preview-v$VERSION"
          TITLE="ExtYomi Preview v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Never overwrite a published release: a merge without a version bump
            # must not silently replace the APKs people already downloaded.
            echo "Release $TAG already exists; skipping publish. Bump versionName to release new APKs."
            exit 0
          fi
          gh release create "$TAG" app/build/outputs/apk/preview/*.apk app/build/outputs/apk/preview/checksums.txt \
            --title "$TITLE" --generate-notes
